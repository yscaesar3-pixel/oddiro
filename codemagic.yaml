workflows:
  oddiro-ios:
    name: ODDIRO - iOS Build & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic上の「Team integrations」→「Apple Developer Portal」で
      # App Store Connect API Keyを登録し、ここにその名前を指定してください。
      # (名前は任意。登録時に付けた名前と一致させること)
      app_store_connect: oddiro_asc_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yutaXXX.oddiro
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.yutaXXX.oddiro"
      node: 20
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Set up code signing (automatic, via App Store Connect API)
        script: |
          xcode-project use-profiles
      - name: Bump build number to latest TestFlight build + 1
        script: |
          cd ios/App
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$BUNDLE_ID" || echo 0)
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 本番審査に自動提出したい場合は下記を true にする（初回は false のまま
        # 手動でApp Store Connect側から審査提出することを推奨）
        submit_to_app_store: false
